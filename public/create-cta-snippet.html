<section id="landing-create">
  <div class="sec-head">
    <div class="eyebrow">MAKE YOUR OWN</div>
    <h2 class="serif">치수·원단부터 직접 골라 만들어보세요</h2>
    <p>옷 종류를 정하고, 기장·둘레 숫자를 직접 입력한 뒤 원하는 원단을 골라 채색하는 제작 스튜디오예요.</p>
  </div>

        <path d="M28 24 L28 14 L52 14 L52 24" fill="none" stroke="#D8663F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="40" cy="44" r="8" fill="none" stroke="#FBFAF6" stroke-width="3"/>
      </svg>

    <p>버튼을 누르면 마네킹 위에서 옷 종류·치수를 정하고, 부위별로 원단을 골라 채색해볼 수 있어요.</p>
    <div class="design-mode-btns">
      <button class="btn btn-primary" id="open-create-flow-btn" type="button">제작 스튜디오 열기</button>
