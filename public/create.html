<!-- create.html : 제작 스튜디오 팝업 HTML 조각. index.html이 동적으로 불러와서 삽입해요. -->
<div class="modal-overlay wizard-overlay" id="create-modal" hidden>
  <div class="modal-box wizard-box">
    <div class="wizard-header">
      <div class="wizard-steps">
        <span class="wizard-step active">제작 스튜디오</span>
      </div>
      <button class="wizard-close" id="create-modal-close" type="button" aria-label="닫기">✕</button>
    </div>

    <div class="wizard-panel">
      <div class="sec-head" style="text-align:left; margin-bottom:16px;">
        <div class="eyebrow">제작 스튜디오 (베타)</div>
        <h2 class="serif" style="font-size:24px; margin:4px 0 6px;">내 치수·원단으로 옷 만들기</h2>
        <p style="margin:0;">옷 종류와 기장·둘레를 정하고, 앞면·뒷면·소매·옆면마다 원하는 원단을 골라 채색해보세요.</p>
      </div>

      <div class="type-row" id="type-row"></div>

      <div class="viewer-box">
        <div id="create-3d"></div>
        <p class="viewer-loading" id="create-loading">마네킹을 불러오는 중…</p>
        <p class="viewer-hint">드래그로 회전 · 옷을 탭해서 채색</p>
      </div>

      <div class="size-grid">
        <label>
          <span>기장</span>
          <div class="size-control">
            <input type="range" id="length-range" min="0.6" max="1.6" step="0.02" value="1">
            <input type="number" id="length-number" min="0.6" max="1.6" step="0.01" value="1" inputmode="decimal">
          </div>
        </label>
        <label>
          <span>둘레</span>
          <div class="size-control">
            <input type="range" id="girth-range" min="0.7" max="1.5" step="0.02" value="1">
            <input type="number" id="girth-number" min="0.7" max="1.5" step="0.01" value="1" inputmode="decimal">
          </div>
        </label>
      </div>

      <div class="section-label">원단 선택 <span class="hint">(고른 뒤 옷을 탭하세요)</span></div>
      <div class="fabric-row" id="fabric-row"></div>

      <div class="section-label">부위별 배정 현황</div>
      <div class="part-list" id="part-list"></div>

      <div class="reset-row">
        <button class="btn btn-ghost-dark" id="reset-btn" type="button">이 옷 초기화</button>
      </div>
    </div>
  </div>
</div>
